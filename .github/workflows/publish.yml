name: Build and publish package as release

on:
  push:
    tags:
      - 'v*' # Only publish when a pushed tag starts with v
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add custom debian repo
        run: |
          # Install necessary dependencies for setup
          sudo apt update && sudo apt install -y curl gnupg

          # Add my personal package repository
          echo "deb [signed-by=/usr/share/keyrings/myrepo.gpg] https://sleiphan.github.io/debian-repo stable main" | sudo tee /etc/apt/sources.list.d/myrepo.list

          # Add my package repository's public gpg key
          curl -fsSL https://sleiphan.github.io/debian-repo/public.key | gpg --dearmor -o /usr/share/keyrings/myrepo.gpg

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake liburing-dev libctools-dev

      - name: Debug io_uring environment
        run: |
          echo "=== OS ==="
          cat /etc/os-release

          echo "=== Packages ==="
          dpkg-query -W -f='${Package} ${Version}\n' \
            liburing-dev liburing2 linux-libc-dev || true

          echo "=== APT candidates ==="
          apt-cache policy liburing-dev linux-libc-dev || true

          echo "=== IORING_ACCEPT_DONTWAIT ==="
          grep -R -n "IORING_ACCEPT_DONTWAIT" \
            /usr/include/linux/io_uring.h \
            /usr/include/liburing/io_uring.h 2>/dev/null || true

          echo "=== IORING_ACCEPT_MULTISHOT ==="
          grep -R -n "IORING_ACCEPT_MULTISHOT" \
            /usr/include/linux/io_uring.h \
            /usr/include/liburing/io_uring.h 2>/dev/null || true

          echo "=== io_uring_initialize_sqe ==="
          grep -R -n "io_uring_initialize_sqe" \
            /usr/include/liburing.h \
            /usr/include/liburing 2>/dev/null || true

          echo "=== Header locations ==="
          dpkg -L liburing-dev | grep -E '/(liburing|io_uring)\.h$' || true
          dpkg -L linux-libc-dev | grep '/linux/io_uring.h$' || true

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build

      - name: Create Debian package
        run: |
          cpack --config build/CPackConfig.cmake -G DEB

      - name: Simplify package file names
        run: |
          mv ./*dev.deb ./mcon-dev.deb
          mv ./*runtime.deb ./mcon-runtime.deb

      - name: Upload package as release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
